<script>
  let activated = false;

  function updateFlashlight(x, y) {
    document.documentElement.style.setProperty('--pointerX', x + 'px');
    document.documentElement.style.setProperty('--pointerY', y + 'px');

    if (!activated) {
      document.body.classList.add('flashlight-active');
      activated = true;
    }
  }

  // Desktop: mouse movement
  window.addEventListener('mousemove', function (e) {
    updateFlashlight(e.clientX, e.clientY);
  });

  // Mobile: touch movement
  window.addEventListener('touchstart', function (e) {
    const touch = e.touches[0];
    if (touch) {
      updateFlashlight(touch.clientX, touch.clientY);
    }
  });

  window.addEventListener('touchmove', function (e) {
    const touch = e.touches[0];
    if (touch) {
      updateFlashlight(touch.clientX, touch.clientY);
    }
  }, { passive: true });
    const emailElement = document.getElementById('email');
  const notification = document.getElementById('copy-notification');

  emailElement.addEventListener('click', () => {
    const email = emailElement.textContent;

    // Copy email to clipboard
    navigator.clipboard.writeText(email).then(() => {
      // Show notification
      notification.classList.add('show');

      // Hide after 2 seconds
      setTimeout(() => {
        notification.classList.remove('show');
      }, 2000);
    }).catch(err => {
      console.error('Failed to copy email:', err);
    });
  });

    const shopLink = document.getElementById('shop-link');
  const shopNotification = document.getElementById('shop-notification');

  shopLink.addEventListener('click', (e) => {
    e.preventDefault(); // Prevents link navigation
    shopNotification.classList.add('show');

    // Hide after 2 seconds
    setTimeout(() => {
      shopNotification.classList.remove('show');
    }, 2000);
  });
</script>
